back)` as one of exactly three row texts. Recorded in RetryGaveUpRow's doc comment; one spelling, not two (UX-DR19). T6 NOT TAKEN: no DataTrigger, no second template, no new brush (UX-DR18) — §3.3a says a row carries nothing else, so there is no retry badge to route through UserMessages. Production changes are two comments only: the Mode=OneWay/I15 reminder on MainWindow.xaml's feed template (mirroring CompactOverlay.xaml:78, where the next binding will be written) and T1's ruling in the deck. New UserMessagesTests case scans EVERY production source: the deck writes no "(" on any of the three forms, the two FINISHED ones are $"({…})" at every call site, the pending one is bare — non-vacuous floors on both counts.
