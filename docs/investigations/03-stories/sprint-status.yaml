kippedPause walks ReadTiers — same walk as §3.5's notice, so the surfaces still agree); CacheStatus is the one transient line with no owner clearing it; EngineChainLine falls back to the raw provider id if ProviderNames has no entry. Winston's ruling 1 (deviations 1-3 + the offline line without a button) confirmed as shipped. Full suite 1213 passed, 11-19 s; two runs in seven flaked on PRE-EXISTING cross-collection cases (PerLineFallbackTests.E3_g, TemplateRenderTests' I10 gate-file case) untouched by this story.
  e7-s8-readme-and-about-copy: review                     # order 8 — README + About copy, and the two flaky cases stabilised. README: a new "How translation works" section (free by default · an engine that stops answering is paused and the next takes over · lines already seen are not translated twice) with an "Optional: your own key" subsection — DeepL for what you write only, Azure for what you write and for reading the screen behind the off-by-default tick; AC 2 kept by hedging the quota ("currently gives 2 million characters a month"), never "free forever", nothing said about whether an existing DeepL :fx key still works (U5) beyond the CONFIRMED July-2026 end of sales. Also: the MSI recommended as the default download with the one-sentence reason (rank 3), the P1 expectation paragraph (E9.S9's README half absorbed here on Winston's instruction — flag it in the release-B PR), A10's cache privacy sentence verbatim + Clear cache, "Cancel read", and three now-false sentences retired ("OCR always uses the free Google engine", "Google's free translate endpoint", "without re-asking Google"). About: UserMessages.AboutEnginesPauses() under the engines intro, FirstLaunchExpectation() beside Check for updates (§3.8 verbatim; the toast + LastRunVersion stay E9.S10's), and AC 3's MIT line — the MPL-2.0 half has nothing to declare while E8 does not ship. Read-button label reconciled ON THE SHIPPED WORDING (Select area & read once, in the button, the tab hint and the README); A8's paraphrase retired. FLAKE ROOT CAUSE FOUND AND MEASURED: the "Gates" collection was NOT serialised against the STA one — DisableParallelization does not stop other collections running beside it, reproduced with a 2.5 s sleep in the I10 case, which then failed on a 30-min pause opened by a PerLineFallbackTests case in the other collection. Fixed by folding the 9 STA classes INTO the Gates collection (a real MainWindow reaches ProviderGates through TranslationChains, so they were registry touchers all