# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog -> in-progress: automatically when the first story is created (via create-story)
#   - in-progress -> done: manually when all stories reach 'done'
#
# Story Status:
#   - backlog: Story only exists in epics.md
#   - ready-for-dev: Story file created in the stories folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#   - blocked-owner: The story file exists and is complete, but the work cannot start without the
#                    owner: a network capture / soak he must designate a connection for (E3.S1/S2/S9),
#                    or a decision only he can make. NOT a backlog item — the context work is done.
#   - blocked-dep: The story file exists and is complete, but a hard gate in another story is not
#                  met yet (E3.S5 needs E3.S2's capture; no code may be written before it).
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# Action Item Status:
#   - open / in-progress / done
#
# WORKFLOW NOTES:
# ===============
# - Epic transitions to 'in-progress' automatically when its first story is created
# - Stories can be worked in parallel if capacity allows; here they are ordered by increment
# - Dev moves a story to 'review', then runs code-review (fresh context, different LLM recommended)
# - Retrospective appends its action items to action_items; sprint-status surfaces open ones
#
# PROJECT-SPECIFIC DEVIATIONS (deliberate, see sprint-plan.md):
# ============================================================
# 1. KEY FORMAT. epics.md numbers stories "E1.S1", not "1.1". Keys here are
#    "e{epic}-s{story}-{kebab-title}" and the story files are "stories/E1.S1-<slug>.md".
#    A key is therefore NOT the plain "{n}-{n}-{title}" the default workflow expects.
# 2. 'ready-for-dev' MEANS "the story file exists and is complete". It does NOT mean work may
#    start: every story that touches production code is gated behind the owner's explicit
#    Phase-4 go (ground rule 2, docs/investigations/README.md). Each story file says so in its
#    status line: "ready-for-dev (Phase 4 - owner's go required)".
# 3. FIVE ITEMS ARE NOT AGENT WORK and will never move past 'backlog' by an agent:
#    e8-s5, e9-s1, e9-s2, e9-s3, e9-s4, e9-s7, e9-s8, e9-s12 are owner tasks.
# 4. NINE ITEMS ARE SPIKES with a measurable exit criterion and a go/no-go:
#    e2-s7 (U9), e3-s1 (U1), e3-s2 (U2), e3-s9 (U3), e4-s3 (U8), e6-s1 (U4), e6-s6 (U5),
#    e8-s1 (U7), e8-s4 (U6). e3-s1/e3-s2/e3-s9 additionally require the owner's explicit go
#    for the requests they send, and must not run from the dev box (Phase-1 incident).
# 5. RELEASE COUPLING: epic-2 and epic-3 are separate PRs but ONE release. A sprint that
#    schedules them into different releases is wrong (owner's decision 2; architecture R7).
# 6. EPIC 3 IMPLEMENTATION ORDER (2026-09-07, Amelia CS): e3-s3 -> e3-s6 -> e3-s4 -> e3-s8 -> e3-s7.
#    E3.S6 is pulled ahead of E3.S4 because E3.S4 needs TextChunker; e3-s5 slots before e3-s7 only
#    if e3-s2's capture lands. Release A.1 CAN ship without Edge: the free chain is then
#    GoogleDict -> GoogleGtx, and the loss of the independent second vendor is recorded as R1 raised.
# 7. E3.S4 IS NOT BLOCKED BY E3.S1. The single-line dict-chrome-ex contract is already measured
#    (benchmark 3.2); only the \n-batch is unknown, and OQ-A's per-line answer is the safe default
#    that ships. U1 is an optimisation (halves LIVE volume), not a gate.

