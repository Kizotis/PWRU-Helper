  e7-s5-live-read-once-overlay-copy: done                 # order 5 — REVIEWED (Amelia CR): one patch — the cancel label was written 20 lines above _readingOnce = true, and since A8 that gap is a button saying "Cancel read" while the flag is false, i.e. a press that STARTS a second read on the shared OCR engine instead of cancelling (latent; nothing between can throw or await). Label and flag are now adjacent, with the re-entrancy question pinned: every guard is `{ CancelReadOnce(); return; }`, CancelReadOnce never clears the flag (the guard stays ARMED for the whole unwind), the one clear is the finally, and the finally is reached only after the awaited ReadLinesAsync — so the engine is free before any next read. Ruling 3 pinned too (idle AutomationProperties.Name; EnterCompactMode hands over _readingOnce itself after Show()). Recorded for Sally: ■ means "stop LIVE" on one overlay button and "cancel this read" on its neighbour — never both at once, since a read stops LIVE and LIVE cannot start during a read. 1193 tests. — AMENDMENT A8 SHIPPED: the read-once button IS the cancel, on both surfaces, and it never disables. SetReadOnceEnabled is gone (name and behaviour — a disabled WPF button raises no Click, which is why two of E5.S4's three cancel routes were unreachable and "only Ctrl+Alt+R can stop a read" was literally true); SetReadOnceCancelMode(bool reading) swaps the main button to "Cancel read" (+ a tooltip that names the hotkey — the deck chose option (a), the button, over "Reading… Ctrl+Alt+R to stop.") and the overlay's icon-only button to ■ with ToolTip/AutomationProperties.Name "Cancel read". A8's two mandatory conditions both hold and are pinned: the `if (_readingOnce) { CancelReadOnce(); return; }` guard is the FIRST line of SelectAreaAndReadOnceAsync (ahead of StopLive()/SelectRegionAsync(), or a cancel press starts a region drag over the game — written three times rather than moved), and nothing is greyed. The overlay's button reaches the same method, so ■ cancels a read from compact mode; zero new controls; E5.S4's CTS path, _readOnceStopped and "Read cancelled." untouched. Both buttons lost their XAML Content/ToolTip — a label that CHANGES cannot live in an attribute (UX-DR19) — so the copy is in UserMessages and written at construction, the SetKeyTestLabels shape, plus EnterCompactMode for a read running when the player goes compact. COPY PASS: §3.3's five outcomes + the two in-flight rows + "Read cancelled." verified against the deck character-for-character (A7's paused fork with E5-g's {n} and E7-a's coarse {t}; AC 5's three join rules read and left as E5.S4's review settled them), §3.4's seven short forms and §3.5's two directions re-verified (both already shipped by E7.S1/S4 — ReplyOutcome.Error already carries the composed short form, so no signature widening was needed), the 120-char main line already bounded. DECISION 1: §3.2's S3 row is NOT rendered and NO copy was written for it — one clock per window (in S3 the chip owns the ticking countdown, so a status {t} is a second clock and a coarse one disagrees with it), one message per state (§3.5's notice already names both engines on that line, once per switch), and requests really are flowing in S3, so a pause-shaped status line would read as a stopped loop; an unrendered deck sentence is UX-DR19 the other way round (E7.S4's own precedent). DECISION 2: D2's "Translated by Google (backup) — Google is paused." is KEPT verbatim — §3.0 rule 1 forbids inventing a name, rule 2 is about the chip's "· backup" suffix and not the vendor, and a same-vendor special case would hide the fact that makes the notice useful (the same vendor's second door). §3.2's 7th row stays retired under E6-c; T5's About nudge deferred to E8 with the OfflineFallbackEnabled setting it is written behind. 1184 → 1191, 6 s.
