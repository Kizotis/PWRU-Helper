ShortDescription: Chat, read and translate Russian faster while playing on the Perfect World RU server.
Description: >-
  A free Windows helper for English, French, Spanish and German speakers playing on the
  Perfect World RU server (pwonline.ru). Five tools in one small app: a click-to-copy
  phrasebook of Russian phrases and gamer slang; on-device screen OCR that reads the game
  chat and translates it, with a live mode that keeps up as new lines arrive; a two-way
  translator (your language to Russian and back) that expands game slang; a squad / LFM
  builder that writes the Russian "looking for group" message for you; and a compact
  always-on-top overlay with the live feed and a reply box. Translation is free by default
  with automatic engine fallback, optional DeepL or Azure keys, and since 0.15.2 an optional
  offline engine you can download so nothing leaves your PC. Screen reading always happens
  locally - no screenshot ever leaves the machine, and there is no game memory access,
  injection or automation.
