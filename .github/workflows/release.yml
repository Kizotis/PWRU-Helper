name: Release

# Tag a commit with e.g. v0.9.0 and push the tag to build BOTH release artifacts and
# publish a GitHub Release:
#   • PWRUHelper.exe                 — portable single-file build (no install)
#   • PWRUHelper-<version>-setup.msi — WiX installer (Start-menu/desktop shortcuts, ARP entry)
# The app's built-in update check reads this release's tag; winget points at the exe/msi.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  # The SignPath action reads the job details and downloads the uploaded artifact with the
  # workflow token. Because this permissions block is explicit, every scope NOT listed here is
  # `none` — so `actions: read` has to be granted or the signing steps fail the moment they are
  # switched on. It costs nothing while signing is dormant.
  actions: read

jobs:
  release:
    runs-on: windows-latest
    # `secrets` is NOT one of the contexts available to a step-level `if:`, so the token is
    # mapped ONCE here (a job-level `env:` may read `secrets`) and every SignPath step tests the
    # mapped string instead. No token set => SIGNING_ENABLED is 'false' => all signing steps are
    # skipped and the release ships the same unsigned exe + msi it always has.
    # See packaging/signpath-signing.md for the repo secret/variables that switch it on.
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test tests/PWRUHelper.Tests -c Release

      - name: Install WiX v5 toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      # Deliberately NOT -p:EnableCompressionInSingleFile. Compressing the bundle stops Windows
      # memory-mapping the assemblies, so they are decompressed into private RAM on every launch.
      # Measured, same machine and build: compressed = 74 MB exe / 267 MB working set / 153 MB
      # private; uncompressed = 179 MB exe / 155 MB working set / 95 MB private. Giving ~110 MB of
      # RAM back to the machine that is also running the game is worth more than the download size —
      # and the MSI recovers most of that size in its own CAB anyway. Keep these flags identical to
      # "Build Portable EXE.bat" and "Build MSI Installer.bat".
      - name: Publish portable single-file exe
        run: >
          dotnet publish PWRUHelper.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none

      # The exe is staged into dist/ FIRST so a single path — dist/PWRUHelper.exe — is both what
      # gets signed (when signing is on) and what the MSI wraps. The portable download and the MSI
      # therefore always ship the exact same build, signed or not.
      - name: Stage the portable exe
        shell: pwsh
        run: |
          $exe = "bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/PWRUHelper.exe"
          if (-not (Test-Path $exe)) { throw "Published exe not found at $exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe "dist/PWRUHelper.exe"

      # ---- sign the exe (dormant until SIGNPATH_API_TOKEN is set) ----
      - name: Upload exe for signing
        id: upload-exe
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/PWRUHelper.exe

      - name: Sign exe with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist          # overwrites dist/PWRUHelper.exe with the signed one

      - name: Build MSI installer (wraps the exe from dist, signed if signing ran)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')     # "v0.9.0" -> "0.9.0"
          wix build installer/Product.wxs -ext WixToolset.UI.wixext -arch x64 `
            -d Version="$version.0" `
            -d ExeFile="dist/PWRUHelper.exe" `
            -d IconFile="assets/icon.ico" `
            -d LicenseFile="installer/license.rtf" `
            -o "dist/PWRUHelper-$version-setup.msi"
          Get-ChildItem dist

      # ---- sign the msi (dormant until SIGNPATH_API_TOKEN is set) ----
      - name: Upload msi for signing
        id: upload-msi
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: dist/PWRUHelper-*-setup.msi

      - name: Sign msi with SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist          # overwrites the msi with the signed one

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PWRU Helper ${{ github.ref_name }}
          files: |
            dist/PWRUHelper.exe
            dist/PWRUHelper-*-setup.msi
          generate_release_notes: true

      # Opens/updates the winget-pkgs PR for this release. Opt-in: only runs on a real tag and
      # only when a WINGET_TOKEN secret (a GitHub PAT that can fork/PR microsoft/winget-pkgs) is
      # set — otherwise it prints how to enable it and exits cleanly.
      # NOTE: `update` needs the package to already exist on winget; do the very first submission
      # once by hand with `wingetcreate new` (see packaging/DISTRIBUTION.md).
      # continue-on-error: the release itself is already published by the previous step — a
      # winget hiccup (first-ever submission, aka.ms outage, PR conflict) must not turn the
      # whole release run red.
      - name: Submit to winget (if configured)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN secret not set — skipping winget submission."
            Write-Host "To enable: create a classic PAT with 'public_repo' scope and add it as the"
            Write-Host "repository secret WINGET_TOKEN. Then each tagged release auto-opens a winget PR."
            exit 0
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          $msiUrl  = "https://github.com/Kizotis/PWRU-Helper/releases/download/${{ github.ref_name }}/PWRUHelper-$version-setup.msi"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update Kizotis.PWRUHelper --version $version --urls "$msiUrl" --submit --token $env:WINGET_TOKEN
